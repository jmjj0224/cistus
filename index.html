<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Cistus</title>
<style>
  @font-face {
    font-family: 'Galmuri11';
    src: url('fonts/Galmuri11.woff2') format('woff2');
    font-display: block;
  }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    color: #f2ecd2; font-family: 'Galmuri11', 'Apple SD Gothic Neo', sans-serif;
    -webkit-font-smoothing: none; user-select: none; -webkit-user-select: none; cursor: default;
    touch-action: none; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* --sw, --sh는 화면 크기예요(main.js가 넣어요). 스마트폰을 세로로 들고 있으면 화면 전체를 90도 돌려서 가로로 보여 줘요. */
  #stage { position: absolute; left: 50%; top: 50%; width: var(--sw, 100vw); height: var(--sh, 100vh); transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; }
  #stage.rot { transform: translate(-50%, -50%) rotate(90deg); }
  /* 16:9를 유지한 채 창에 꽉 차게 */
  #frame { position: relative; width: min(var(--sw, 100vw), calc(var(--sh, 100vh) * 16 / 9)); height: min(var(--sh, 100vh), calc(var(--sw, 100vw) * 9 / 16)); overflow: hidden; background: #000; }

  /* 스마트폰 조작: 게임 화면 양옆의 빈 띠까지 포함한 화면 전체가 터치 영역이에요. */
  #touch { position: absolute; inset: 0; display: none; z-index: 5; font-size: 18px; }
  #stage.touch.playing #touch { display: block; }
  #joy, #joyGhost { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; border: 2px solid rgba(242, 236, 210, 0.5); background: rgba(0, 0, 0, 0.2); pointer-events: none; }
  #joy { display: none; }
  #joyGhost { left: max(92px, 13%); bottom: 40%; top: auto; margin: 0 0 -62px -62px; opacity: 0.55; display: flex; align-items: center; justify-content: center; color: #f2ecd2; }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(242, 236, 210, 0.55); }
  #fireBtn { position: absolute; right: max(14px, 3%); bottom: 24%; width: 92px; height: 92px; border-radius: 50%; border: 2px solid rgba(255, 233, 168, 0.75); background: rgba(0, 0, 0, 0.28); color: #ffe9a8; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  #fireBtn.on { background: rgba(255, 196, 80, 0.5); transform: scale(0.94); }
  #pauseBtn { position: absolute; right: max(10px, 2%); top: max(10px, 4%); width: 46px; height: 46px; border-radius: 8px; border: 2px solid rgba(242, 236, 210, 0.4); background: rgba(0, 0, 0, 0.25); color: #f2ecd2; display: flex; align-items: center; justify-content: center; font-size: 16px; letter-spacing: 2px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; font-size: calc(var(--k, 2) * 12px); line-height: 1.7; word-break: keep-all; overflow-wrap: break-word; }
  .outline { text-shadow: 0 0 2px #000, calc(var(--k,2)*1px) calc(var(--k,2)*1px) 0 #000, calc(var(--k,2)*-1px) calc(var(--k,2)*1px) 0 #000, calc(var(--k,2)*1px) calc(var(--k,2)*-1px) 0 #000, calc(var(--k,2)*-1px) calc(var(--k,2)*-1px) 0 #000; }

  #sub { position: absolute; left: 9%; right: 9%; bottom: 6%; text-align: center; }
  #sub div { opacity: 0; transition: opacity 0.9s; word-break: keep-all; }
  #sub div.on { opacity: 1; }

  #prompt { position: absolute; left: 12%; right: 12%; top: 58%; text-align: center; opacity: 0; transition: opacity 0.25s; color: #ffe9a8; }
  #prompt.on { opacity: 1; }

  #title { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 0 9% 5%; box-sizing: border-box; text-align: center; transition: opacity 0.8s; }
  #title .big { font-size: 1.5em; }
  #title .small { opacity: 0.85; font-size: 0.8em; }
  #title.off { opacity: 0; }
  .blink { animation: blink 1.4s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  #pause { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 0 10%; box-sizing: border-box; background: rgba(0,0,0,0.6); text-align: center; }
  #pause.on { display: flex; }

  #scroll { position: absolute; inset: 0; overflow: hidden; display: none; }
  #scroll.on { display: block; }
  #scrollInner { position: absolute; left: 12%; right: 12%; top: 0; text-align: center; will-change: transform; }
  #scrollInner div { min-height: 1.7em; word-break: keep-all; }

  #end { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; text-align: center; opacity: 0; transition: opacity 2.5s; pointer-events: auto; }
  #end.on { display: flex; }
  #end.show { opacity: 1; }
  #end img { width: 34%; aspect-ratio: 1; object-fit: cover; margin-bottom: 3%; display: none; }
  #endLink { display: inline-block; margin-top: 4%; padding: 0.55em 1.3em; border: 2px solid #ffe9a8; color: #ffe9a8; text-decoration: none; }
  #endUrl { opacity: 0.6; font-size: 0.7em; margin-top: 1.5%; user-select: text; -webkit-user-select: text; word-break: break-all; }
  #endRestart { margin-top: 5%; padding: 0.5em 1em; background: none; border: 0; color: #f2ecd2; opacity: 0.6; font: inherit; font-size: 0.8em; }
  #pauseShake { pointer-events: auto; padding: 0.6em 1em; }

  #err { position: absolute; left: 4%; right: 4%; top: 4%; color: #ff9a8a; font-family: monospace; font-size: 14px; white-space: pre-wrap; display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js" } }
</script>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="c"></canvas>
    <div id="ui">
      <div id="title" class="outline">
        <div id="titleMain" class="big"></div>
        <div id="titleStart" class="blink"></div>
        <div id="titleHelp" class="small"></div>
      </div>
      <div id="prompt" class="outline"></div>
      <div id="sub" class="outline"></div>
      <div id="scroll" class="outline"><div id="scrollInner"></div></div>
      <div id="pause" class="outline">
        <div id="pauseTitle"></div>
        <div id="pauseResume" class="blink"></div>
        <div id="pauseShake" style="opacity:.8;font-size:.8em;margin-top:1.5em"></div>
      </div>
      <div id="end">
        <img id="endCover" alt="">
        <div id="endTitle"></div>
        <div id="endArtist"></div>
        <a id="endLink" target="_blank" rel="noopener"></a>
        <div id="endUrl"></div>
        <button id="endRestart" type="button"></button>
      </div>
      <div id="err"></div>
    </div>
  </div>
  <div id="touch">
    <div id="joyGhost"></div>
    <div id="joy"><div id="knob"></div></div>
    <div id="fireBtn"></div>
    <div id="pauseBtn">II</div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
